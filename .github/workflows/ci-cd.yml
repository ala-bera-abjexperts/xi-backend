# CI/CD of this repository: checks the code with ESLint on every push to main.
# When it finishes successfully, XISUITE starts the Story's Tech-Testcases on its own test runner.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a newer push waits instead of cancelling the running check.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Type-aware linting of the whole backend needs more than Node's default memory.
      NODE_OPTIONS: --max-old-space-size=8192
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reports errors and warnings without failing the job, so the Tech-Testcases still start.
      - name: Check ESLint errors and warnings
        continue-on-error: true
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
